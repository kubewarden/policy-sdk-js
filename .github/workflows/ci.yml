on: 
  - push
  - pull_request
  - workflow_call
  
name: CI
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@143b9e4b11ddc47370482267383586e6f1bc7efe # v7.0.1

      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install
      
      - name: Run linting
        run: |
          cd js
          npm run lint
  
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@143b9e4b11ddc47370482267383586e6f1bc7efe # v7.0.1

      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install
            
      - name: Run formatting checks
        run: |
          cd js
          npm run format:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@143b9e4b11ddc47370482267383586e6f1bc7efe # v7.0.1

      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install

      - name: Run unit tests
        run: make unit-tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@143b9e4b11ddc47370482267383586e6f1bc7efe # v7.0.1

      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install

      - name: Build TS code
        run: |
          cd js
          npm run build