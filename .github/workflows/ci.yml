on: 
  - push
  - pull_request
  - workflow_call
  
name: CI
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@d12b2b18e1f9dbfe15c79c9ecb7149cf956704a7 # v8.1.0

      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install
      
      - name: Run linting
        run: |
          cd js
          npm run lint
  
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@d12b2b18e1f9dbfe15c79c9ecb7149cf956704a7 # v8.1.0

      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install
            
      - name: Run formatting checks
        run: |
          cd js
          npm run format:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@d12b2b18e1f9dbfe15c79c9ecb7149cf956704a7 # v8.1.0

      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install

      - name: Run unit tests
        run: make unit-tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@d12b2b18e1f9dbfe15c79c9ecb7149cf956704a7 # v8.1.0

      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install

      - name: Build TS code
        run: |
          cd js
          npm run build