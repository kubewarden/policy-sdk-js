on:
  - push
  - pull_request
  - workflow_call

name: Continuous integration
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: kubewarden/github-actions/policy-gh-action-dependencies@4d25ea5d35d22768786526f592b0f9ba27587c9c # v8.0.0
      - name: Install kwctl
        uses: kubewarden/github-actions/kwctl-installer@4d25ea5d35d22768786526f592b0f9ba27587c9c # v8.0.0
      - name: Install javy
        uses: ./.github/actions/javy-installer
      - name: Install npm dependencies in js directory
        run: |
          cd js
          npm install

      - name: Run e2e tests
        run: make e2e-tests
